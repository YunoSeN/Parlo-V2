              },
              {
                "@type": "Question",
                "name": "Can I practice on my phone without interrupting the conversation for corrections?",
                "acceptedAnswer": {
                  "@type": "Answer",

              }
            ]

                "@type": "HowToStep",
                "name": "Select a real-world roleplay scenario",
                "text": "Load a café, travel, workplace, or custom conversation scene with clear speaking goals."

                "@type": "HowToStep",
